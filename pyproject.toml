[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "rapidocr_ng"
version = "5.0.0a4"
description = "RapidOCR 5 (rapidocr_ng): PP-OCRv6 with the native engine; import name rapidocr"
readme = "python/README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "SWHL", email = "liekkaskono@163.com" }]
keywords = ["ocr", "ppocr", "ppocrv6", "rapidocr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
]
dependencies = [
    "numpy>=1.21",
    "Pillow>=9.0",
    "PyYAML>=6.0",
    "requests",
    "tqdm",
]

[project.urls]
Documentation = "https://rapidai.github.io/RapidOCRDocs"
Repository = "https://github.com/RapidAI/RapidOCR"

[project.scripts]
rapidocr = "rapidocr.main:main"

[tool.scikit-build]
cmake.source-dir = "."
cmake.build-type = "Release"
cmake.args = ["-DPPOCR_BUILD_EXAMPLES=OFF", "-DPPOCR_BUILD_TESTS=OFF", "-DPPOCR_ENABLE_VULKAN=OFF"]
wheel.packages = ["python/src/rapidocr"]
minimum-version = "0.10"

[tool.scikit-build.cmake.define]
PPOCR_BUILD_SHARED = "ON"
PPOCR_BUILD_STATIC = "OFF"
PPOCR_ENABLE_VULKAN = "OFF"

[tool.scikit-build.sdist]
exclude = [
    "third_party/**",
    "build*/**",
    ".git/**",
    "python/.pytest_cache/**",
    "ci-models/**",
    "wheelhouse/**",
    "dist/**",
]

# Official PyPA manylinux2014 (glibc 2.17, devtoolset GCC 10). The native
# library is ctypes-loaded, so each CPython wheel is a retag of the same build.
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "pp* *-musllinux_* *i686 *-win32 *-win_amd64 *-macosx_*"
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
test-requires = ["pytest"]
test-command = "bash {project}/python/tests/ci_wheel_check.sh"

[tool.cibuildwheel.linux]
environment = { CMAKE_ARGS = "-DPPOCR_BUILD_EXAMPLES=OFF -DPPOCR_BUILD_TESTS=OFF -DPPOCR_BUILD_STATIC=OFF -DPPOCR_BUILD_SHARED=ON -DPPOCR_ENABLE_VULKAN=OFF", CMAKE_BUILD_PARALLEL_LEVEL = "4", PIP_CONSTRAINT = "/project/python/tests/ci-constraints.txt" }

# macOS arm64 wheels are built only by the wheels-macos-arm64 job (macos-14),
# which overrides `skip` above. Metal is on: glslang and spirv-cross are build
# tools only; the wheel needs nothing beyond Metal.framework at runtime.
[tool.cibuildwheel.macos]
archs = ["arm64"]
before-all = "brew install glslang spirv-cross"
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0", CMAKE_ARGS = "-DPPOCR_BUILD_EXAMPLES=OFF -DPPOCR_BUILD_TESTS=OFF -DPPOCR_BUILD_STATIC=OFF -DPPOCR_BUILD_SHARED=ON -DPPOCR_ENABLE_VULKAN=OFF -DPPOCR_ENABLE_METAL=ON -DPPOCR_REQUIRE_METAL=ON -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0", CMAKE_BUILD_PARALLEL_LEVEL = "3", SKBUILD_LOGGING_LEVEL = "INFO", SKBUILD_BUILD_VERBOSE = "true" }
test-command = "bash {project}/python/tests/ci_wheel_check_macos.sh"
