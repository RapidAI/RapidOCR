[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "rapidocr"
version = "5.0.0a1"
description = "RapidOCR 5, the next major version of rapidocr: PP-OCRv6 with the native engine"
readme = "python/README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "SWHL", email = "liekkaskono@163.com" }]
keywords = ["ocr", "ppocr", "ppocrv6", "rapidocr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
]
dependencies = [
    "numpy>=1.21",
    "Pillow>=9.0",
    "PyYAML>=6.0",
    "requests",
    "tqdm",
]

[project.urls]
Documentation = "https://rapidai.github.io/RapidOCRDocs"
Repository = "https://github.com/RapidAI/RapidOCR"

[project.scripts]
rapidocr = "rapidocr.main:main"

[tool.scikit-build]
cmake.source-dir = "."
cmake.build-type = "Release"
cmake.args = ["-DPPOCR_BUILD_EXAMPLES=OFF", "-DPPOCR_BUILD_TESTS=OFF"]
wheel.packages = ["python/src/rapidocr"]
minimum-version = "0.10"

[tool.scikit-build.cmake.define]
PPOCR_BUILD_SHARED = "ON"
PPOCR_BUILD_STATIC = "OFF"

[tool.scikit-build.sdist]
exclude = [
    "third_party/**",
    "build*/**",
    ".git/**",
    "python/.pytest_cache/**",
]

# Official PyPA manylinux2014 (glibc 2.17, devtoolset GCC). The native library
# is ctypes-loaded, so each CPython wheel is a retag of the same build.
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "pp* *-musllinux_* *i686 *-win32 *-win_amd64 *-macosx_*"
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
test-command = "python -c \"import rapidocr; info = rapidocr.cpu_info(); assert info['active_isa'] in {'scalar', 'avx2', 'avx512', 'neon'}, info; print(rapidocr.__version__, info['active_isa'])\""

[tool.cibuildwheel.linux]
environment = { CMAKE_ARGS = "-DPPOCR_BUILD_EXAMPLES=OFF -DPPOCR_BUILD_TESTS=OFF -DPPOCR_BUILD_STATIC=OFF -DPPOCR_BUILD_SHARED=ON" }
